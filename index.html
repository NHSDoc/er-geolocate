<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ER GeoLocate</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { 
            --nhs-blue: #005eb8; --nhs-grey: #f0f4f5; --nhs-text: #212b32; 
            --success-green: #007f3b; --warning-amber: #fff9e6; --error-red: #d5281b;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--nhs-grey); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; color: var(--nhs-text); }
        .container { width: 100%; max-width: 480px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid var(--nhs-blue); }
        .logo-header { text-align: center; margin-bottom: 15px; }
        .app-logo { width: 120px; height: auto; margin-bottom: 5px; }
        .app-title { color: var(--nhs-blue); font-size: 1.6rem; font-weight: bold; margin: 0; }
        
        .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .input-group { flex: 2; }
        .input-group.initials { flex: 1; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; color: var(--nhs-blue); }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
        .btn-capture { background: var(--nhs-blue); color: white; }
        .btn-capture:disabled { background: #ccc; cursor: not-allowed; }
        .btn-download { background: var(--success-green); color: white; display: none; }

        .probity-box { background: var(--warning-amber); border: 2px solid #ffcc00; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.8rem; line-height: 1.3; color: #444; }
        .probity-box input { transform: scale(1.3); margin-right: 10px; vertical-align: middle; }

        #result-area { display: none; width: 100%; }
        /* PDF Container - Redesigned for A5 Vertical Stack */
        #export-container { padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; }
        
        .pdf-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--nhs-blue); padding-bottom: 8px; margin-bottom: 10px; }
        .pdf-header-text h1 { color: var(--nhs-blue); font-size: 1.3rem; margin: 0; }
        .pdf-header-text h2 { color: #666; font-size: 0.9rem; margin: 2px 0 0 0; }

        .map-wrapper { width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid #eee; margin-bottom: 12px; }
        #map-img { width: 100%; display: block; background: #f0f0f0; min-height: 180px; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; font-size: 0.75rem; line-height: 1.4; }
        .data-item b { color: var(--nhs-blue); display: block; font-size: 0.7rem; text-transform: uppercase; }
        
        .qr-area { text-align: center; border-top: 1px dashed #ccc; padding-top: 12px; }
        #qrcode { display: inline-block; padding: 8px; border: 1px solid #eee; background: #fff; }
        
        #facility-section { font-size: 0.75rem; color: #555; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; display: none; }
        .copyright { text-align: center; color: #999; font-size: 0.7rem; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-header">
        <img src="logo.png" alt="ER GeoLocate Logo" class="app-logo">
        <h1 class="app-title">ER GeoLocate</h1>
    </div>

    <div class="input-row">
        <div class="input-group initials">
            <label for="userInitials">Initials:</label>
            <input type="text" id="userInitials" placeholder="JD" maxlength="3" style="text-transform: uppercase;">
        </div>
        <div class="input-group">
            <label for="wardDept">Dept / Ward:</label>
            <input type="text" id="wardDept" placeholder="e.g. A&E" maxlength="30">
        </div>
    </div>

    <button id="capBtn" class="btn btn-capture" onclick="captureData()" disabled>📍 Verify & Capture Location</button>
    
    <div class="probity-box">
        <label>
            <input type="checkbox" id="probityCheck" onchange="toggleButton()">
            <b>Probity:</b> I certify recording clinical hours outside my rostered schedule. Bound by GMC guidance, I confirm this data is accurate.
        </label>
    </div>

    <div id="status" style="text-align:center; font-size: 0.8rem; color: #666; margin-bottom: 10px;">Accept declaration to begin.</div>

    <div id="result-area">
        <div id="export-container">
            <div class="pdf-header">
                <div class="pdf-header-text">
                    <h1>ER GeoLocate</h1>
                    <h2>Evidence ID: <span id="pdf-initials"></span></h2>
                </div>
                <img src="logo.png" style="width:70px; height:auto;">
            </div>
            
            <div class="map-wrapper">
                <img id="map-img" crossorigin="anonymous" src="">
            </div>
            
            <div class="data-grid">
                <div class="data-item"><b>Clinician Initials</b><span id="display-initials"></span></div>
                <div class="data-item"><b>Department</b><span id="dept-display"></span></div>
                <div class="data-item"><b>UK Network Time</b><span id="ind-time"></span></div>
                <div class="data-item"><b>Device Time</b><span id="dev-time"></span></div>
                <div class="data-item"><b>GPS Coordinates</b><span id="coords-display"></span></div>
                <div class="data-item"><b>Reference</b><span id="session-display"></span></div>
            </div>

            <div id="facility-section">
                <b>Nearest Verified Facility:</b> <span id="facility-display"></span>
            </div>

            <div class="qr-area">
                <div id="qrcode"></div>
            </div>
        </div>
        <button id="dlBtn" class="btn btn-download" onclick="downloadPDF()">Download ER GeoLocate Evidence</button>
    </div>
</div>

<div class="copyright">© Digestiv</div>

<script>
    const API_KEY = 'AIzaSyAS4xNopFGKYRQwssv2cfkFO-fCiHinYT8';

    function sanitize(str) {
        const temp = document.createElement('div');
        temp.textContent = str;
        return temp.innerHTML;
    }

    function toggleButton() {
        document.getElementById('capBtn').disabled = !document.getElementById('probityCheck').checked;
    }

    async function captureData() {
        const status = document.getElementById('status');
        const capBtn = document.getElementById('capBtn');
        const initials = sanitize(document.getElementById('userInitials').value).toUpperCase() || "N/A";
        const deptName = sanitize(document.getElementById('wardDept').value) || "Not Specified";
        
        capBtn.disabled = true;
        status.innerText = "Syncing UK-locked verification...";

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude: lat, longitude: lon } = pos.coords;
            const timeData = await fetchUKTime();
            const sid = 'ER-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            
            // Facility logic (Strict 200m)
            const facility = await getNearestFacility(lat, lon);
            const facSection = document.getElementById('facility-section');
            if (facility && facility.dist <= 0.2) {
                document.getElementById('facility-display').innerText = `${facility.name} (${(facility.dist * 1000).toFixed(0)}m)`;
                facSection.style.display = "block";
            } else {
                facSection.style.display = "none";
            }

            document.getElementById('display-initials').innerText = initials;
            document.getElementById('pdf-initials').innerText = initials;
            document.getElementById('dept-display').innerText = deptName;
            document.getElementById('ind-time').innerText = timeData;
            document.getElementById('dev-time').innerText = new Date().toLocaleString('en-GB');
            document.getElementById('coords-display').innerText = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            document.getElementById('session-display').innerText = sid;
            
            document.getElementById('map-img').src = `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lon}&zoom=15&size=600x350&markers=color:blue%7Clabel:H%7C${lat},${lon}&key=${API_KEY}`;
            
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = ""; 
            new QRCode(qrDiv, { 
                text: `REF:${sid}|USER:${initials}|UK:${timeData}|GPS:${lat},${lon}`, 
                width: 160, height: 160, correctLevel: QRCode.CorrectLevel.H 
            });

            document.getElementById('result-area').style.display = 'block';
            document.getElementById('dlBtn').style.display = 'flex';
            status.innerText = "Verification Ready.";
            capBtn.disabled = false;
        }, (err) => { 
            status.innerText = "GPS Error. Check settings."; 
            capBtn.disabled = false; 
        });
    }
