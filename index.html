<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ER GeoLocate</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { 
            --nhs-blue: #005eb8; --nhs-grey: #f0f4f5; --nhs-text: #212b32; 
            --success-green: #007f3b; --warning-amber: #fff9e6; --error-red: #d5281b;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--nhs-grey); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; color: var(--nhs-text); }
        .container { width: 100%; max-width: 480px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid var(--nhs-blue); }
        
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .input-group { flex: 2; }
        .input-group.initials { flex: 1; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 2px; color: var(--nhs-blue); }
        .input-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
        .btn-capture { background: var(--nhs-blue); color: white; }
        .btn-download { background: var(--success-green); color: white; display: none; }

        .probity-box { background: var(--warning-amber); border: 2px solid #ffcc00; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 0.75rem; line-height: 1.2; color: #444; }

        #result-area { display: none; width: 100%; }
        #export-container { padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 6px; width: 100%; box-sizing: border-box; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; font-size: 0.65rem; line-height: 1.05; }
        .data-item b { color: var(--nhs-blue); display: block; font-size: 0.6rem; text-transform: uppercase; margin-bottom: 1px; }
        
        .unverified-tag { color: var(--error-red); font-weight: bold; }
        
        .qr-area { text-align: center; border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 4px; }
        #qrcode { display: inline-block; padding: 4px; border: 1px solid #eee; background: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center; margin-bottom:12px;">
        <img src="logo.png" style="width:100px; height:auto;">
        <h1 style="color:var(--nhs-blue); font-size:1.4rem; margin:0;">ER GeoLocate</h1>
    </div>

    <div class="input-row">
        <div class="input-group initials">
            <label>Initials:</label>
            <input type="text" id="userInitials" maxlength="2" style="text-transform: uppercase;">
        </div>
        <div class="input-group">
            <label>Speciality:</label>
            <input type="text" id="wardDept" maxlength="30">
        </div>
    </div>

    <button id="capBtn" class="btn btn-capture" onclick="captureData()" disabled>📍 Verify & Capture Location</button>
    
    <div class="probity-box">
        <label>
            <input type="checkbox" id="probityCheck" onchange="document.getElementById('capBtn').disabled = !this.checked">
            <b>Probity:</b> I certify recording clinical hours outside my rostered schedule. Bound by GMC guidance, I confirm this data is accurate.
        </label>
    </div>

    <div id="status" style="text-align:center; font-size: 0.75rem; color: #666; margin-bottom: 8px;">Accept declaration to begin.</div>

    <div id="result-area">
        <div id="export-container">
            <div style="display:flex; justify-content:space-between; border-bottom: 2px solid var(--nhs-blue); padding-bottom:5px; margin-bottom:8px;">
                <div>
                    <h1 style="color:var(--nhs-blue); font-size:1.1rem; margin:0;">ER GeoLocate</h1>
                    <h2 style="color:#666; font-size:0.75rem; margin:0;">Evidence ID: <span id="pdf-initials"></span></h2>
                </div>
                <img src="logo.png" style="width:65px; height:auto;">
            </div>
            
            <div style="width:100%; border-radius:4px; overflow:hidden; border:1px solid #eee; margin-bottom:8px;">
                <img id="map-img" crossorigin="anonymous" style="width:100%; display:block; min-height:140px;">
            </div>
            
            <div class="data-grid">
                <div class="data-item"><b>Clinician Initials</b><span id="display-initials"></span></div>
                <div class="data-item"><b>Speciality</b><span id="dept-display"></span></div>
                <div class="data-item"><b>UK Network Time</b><span id="ind-time"></span></div>
                <div class="data-item"><b>Device Time</b><span id="dev-time"></span></div>
                <div class="data-item"><b>GPS Coordinates</b><span id="coords-display"></span></div>
                <div class="data-item"><b>Reference</b><span id="session-display"></span></div>
            </div>

            <div id="facility-section" style="font-size:0.65rem; color:#555; border-top:1px solid #eee; padding-top:4px; display:none;">
                <b>Nearest Verified Facility:</b> <span id="facility-display"></span>
            </div>

            <div class="qr-area"><div id="qrcode"></div></div>
        </div>
        <button id="dlBtn" class="btn btn-download" onclick="downloadPDF()">Download ER GeoLocate Evidence</button>
    </div>
</div>

<script>
    const API_KEY = 'AIzaSyAS4xNopFGKYRQwssv2cfkFO-fCiHinYT8';
    const specialties = ["Gastroenterology", "Cardiology", "Acute Medicine", "General Surgery", "Paediatrics", "Neurology", "Oncology", "Trauma & Orthopaedics", "Renal Medicine", "Maternity", "Geratology", "Haematology"];

    function updatePlaceholders() {
        const initInput = document.getElementById('userInitials');
        const specInput = document.getElementById('wardDept');
        if (!initInput.value) initInput.placeholder = String.fromCharCode(65+Math.random()*26, 65+Math.random()*26);
        if (!specInput.value) specInput.placeholder = specialties[Math.floor(Math.random()*specialties.length)];
    }
    setInterval(updatePlaceholders, 3000); updatePlaceholders();

    async function getNetworkTime() {
        const apis = ['https://worldtimeapi.org/api/timezone/Europe/London', 'https://timeapi.io/api/Time/current/zone?timeZone=Europe/London'];
        for (let url of apis) {
            try {
                const res = await fetch(url, { signal: AbortSignal.timeout(4000) });
                const data = await res.json();
                return { time: new Date(data.datetime || data.dateTime).toLocaleString('en-GB', {timeZone: 'Europe/London'}), verified: true };
            } catch (e) {}
        }
        // Web Header Fallback
        try {
            const res = await fetch('https://www.google.com', { method: 'HEAD', mode: 'no-cors' });
            if (res.headers.get('date')) return { time: new Date(res.headers.get('date')).toLocaleString('en-GB', {timeZone: 'Europe/London'}), verified: true };
        } catch (e) {}
        
        // Final Fallback to Device Time (Flagged as Unverified)
        return { time: new Date().toLocaleString('en-GB', {timeZone: 'Europe/London'}), verified: false };
    }

    async function captureData() {
        const status = document.getElementById('status');
        const capBtn = document.getElementById('capBtn');
        capBtn.disabled = true;
        status.innerText = "Syncing network time...";

        const timeObj = await getNetworkTime();
        const initials = document.getElementById('userInitials').value.toUpperCase() || "N/A";
        const dept = document.getElementById('wardDept').value || "Not Specified";

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude: lat, longitude: lon } = pos.coords;
            const sid = 'ER-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            
            const timeDisplay = document.getElementById('ind-time');
            timeDisplay.innerText = timeObj.time;
            if (!timeObj.verified) {
                timeDisplay.innerHTML += ' <span class="unverified-tag">(Unverified, device based)</span>';
            }

            document.getElementById('display-initials').innerText = initials;
            document.getElementById('pdf-initials').innerText = initials;
            document.getElementById('dept-display').innerText = dept;
            document.getElementById('dev-time').innerText = new Date().toLocaleString('en-GB');
            document.getElementById('coords-display').innerText = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            document.getElementById('session-display').innerText = sid;
            document.getElementById('map-img').src = `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lon}&zoom=15&size=600x200&markers=color:blue%7C${lat},${lon}&key=${API_KEY}`;
            
            new QRCode(document.getElementById('qrcode'), { text: `REF:${sid}|USER:${initials}|TIME:${timeObj.time}|VERIFIED:${timeObj.verified}`, width: 140, height: 140 });

            document.getElementById('result-area').style.display = 'block';
            document.getElementById('dlBtn').style.display = 'flex';
            status.innerText = timeObj.verified ? "Evidence Secured." : "Evidence Secured (Local Sync).";
            capBtn.disabled = false;
        });
    }

    function downloadPDF() {
        html2canvas(document.getElementById('export-container'), { useCORS: true, scale: 2.2 }).then(canvas => {
            const pdf = new jspdf.jsPDF('p', 'mm', 'a5');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 8, 128, 0);
            pdf.save(`ER_Evidence_${Date.now()}.pdf`);
        });
    }
</script>
</body>
</html>
