<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ER GeoLocate</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --nhs-blue: #005eb8;
            --nhs-grey: #f0f4f5;
            --nhs-text: #212b32;
            --success-green: #007f3b;
            --warning-amber: #fff9e6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: var(--nhs-grey);
            margin: 0; padding: 12px;
            display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 480px;
            background: white; padding: 18px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 6px solid var(--nhs-blue);
        }

        h1 { color: var(--nhs-blue); text-align: center; font-size: 1.4rem; margin-top: 0; }

        /* Updated Probity Box */
        .probity-box {
            background: var(--warning-amber); border: 2px solid #ffcc00;
            padding: 14px; border-radius: 8px; margin-bottom: 18px;
            font-size: 0.85rem; line-height: 1.4; color: #444;
        }

        .probity-box input { transform: scale(1.5); margin-right: 12px; vertical-align: middle; }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 8px;
            font-weight: bold; font-size: 1rem; cursor: pointer;
            margin-bottom: 10px; display: flex; align-items: center; justify-content: center;
        }

        .btn-capture { background: var(--nhs-blue); color: white; }
        .btn-capture:disabled { background: #ccc; opacity: 0.6; }
        .btn-download { background: var(--success-green); color: white; display: none; }

        #export-container { margin-top: 15px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #fff; }
        
        .map-wrapper { position: relative; width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid #eee; }
        #map-img { width: 100%; display: block; min-height: 280px; background: #f0f0f0; }

        /* Larger, more scannable QR Code */
        #qrcode {
            position: absolute; bottom: 8px; right: 8px;
            background: white; padding: 8px; border: 1px solid #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .info-box { margin-top: 12px; font-size: 0.85rem; line-height: 1.5; border-top: 1px solid #eee; padding-top: 10px; }
        
        .admin-links { margin-top: 20px; }
        .admin-links a {
            display: block; color: var(--nhs-blue); text-decoration: none;
            padding: 12px; background: #f0f7ff; margin-bottom: 8px; border-radius: 6px; font-size: 0.85rem;
            border-left: 4px solid var(--nhs-blue);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ER GeoLocate</h1>

    <div class="probity-box">
        <label>
            <input type="checkbox" id="probityCheck" onchange="toggleButton()">
            <b>Probity:</b> I certify recording clinical hours outside my rostered schedule. Bound by GMC guidance, I confirm this data is accurate; falsifying location or device time/date is considered fraud.
        </label>
    </div>

    <button id="capBtn" class="btn btn-capture" onclick="captureData()" disabled>📍 Verify & Capture Location</button>
    <div id="status" style="text-align:center; font-size: 0.8rem; color: #666; margin-bottom: 10px;">Accept declaration to proceed</div>

    <div id="result-area">
        <div id="export-container">
            <div class="map-wrapper">
                <img id="map-img" src="" alt="Awaiting Map...">
                <div id="qrcode"></div>
            </div>
            <div class="info-box">
                <b>Verified UK Time:</b> <span id="time-display">---</span><br>
                <b>GPS Coordinates:</b> <span id="coords-display">---</span><br>
                <b>Report Reference:</b> <span id="session-display">---</span>
            </div>
        </div>
        <button id="dlBtn" class="btn btn-download" onclick="downloadPDF()">📄 Download PDF Evidence</button>
    </div>

    <div class="admin-links">
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <a href="https://www.bma.org.uk/pay-and-contracts/working-hours/work-schedule/exception-reporting-for-resident-doctors" target="_blank">BMA Exception Reporting Guide</a>
        <a href="https://www.nhsemployers.org/publications/exception-reporting-guidance-hr-and-medical-staffing" target="_blank">NHS Employers: Policy Guidance</a>
        <a href="https://www.nhsemployers.org/articles/exception-reporting-reform-update" target="_blank">NHS Employers: Reform Update</a>
    </div>
</div>

<script>
    // YOUR API KEY INTEGRATED
    const API_KEY = 'AIzaSyAS4xNopFGKYRQwssv2cfkFO-fCiHinYT8';

    function toggleButton() {
        const isChecked = document.getElementById('probityCheck').checked;
        document.getElementById('capBtn').disabled = !isChecked;
        document.getElementById('status').innerText = isChecked ? "GPS Ready" : "Accept declaration to proceed";
    }

    async function captureData() {
        const status = document.getElementById('status');
        status.innerText = "Syncing with UK Network Time...";
        
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude: lat, longitude: lon } = pos.coords;
            
            // UK-Locked Time (Europe/London)
            let ukTime = "";
            try {
                const res = await fetch('https://worldtimeapi.org/api/timezone/Europe/London');
                const data = await res.json();
                ukTime = new Date(data.datetime).toLocaleString('en-GB', { timeZone: 'Europe/London' });
            } catch (e) {
                ukTime = new Date().toLocaleString('en-GB') + " (Manual Check Required)";
            }

            const sid = 'ER-' + Math.random().toString(36).substr(2, 6).toUpperCase();

            // UI Display
            document.getElementById('time-display').innerText = ukTime;
            document.getElementById('coords-display').innerText = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            document.getElementById('session-display').innerText = sid;
            
            // Map Image Request
            document.getElementById('map-img').src = `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lon}&zoom=16&size=600x450&markers=color:blue%7C${lat},${lon}&key=${API_KEY}`;

            // ENHANCED QR CODE (140px size for easier phone-to-phone scanning)
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = ""; 
            new QRCode(qrDiv, {
                text: `VERIFIED_REPORT\nID:${sid}\nUK_TIME:${ukTime}\nGPS:${lat},${lon}`,
                width: 140, 
                height: 140,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById('dlBtn').style.display = 'flex';
            status.innerText = "Location Authenticated.";
        }, (err) => {
            status.innerText = "Error: Please enable Location/GPS in Samsung Settings.";
        });
    }

    async function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const status = document.getElementById('status');
        status.innerText = "Generating PDF...";
        
        const canvas = await html2canvas(document.getElementById('export-container'), { scale: 3 });
        const pdf = new jsPDF('p', 'mm', 'a4');
        
        pdf.setFontSize(18);
        pdf.setTextColor(0, 94, 184); // NHS Blue
        pdf.text("ER GeoLocate: Verified Attendance Report", 20, 25);
        
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 15, 35, 180, 0);
        
        pdf.setFontSize(9);
        pdf.setTextColor(150);
        pdf.text("Falsification of this record is a GMC probity matter and NHS fraud.", 20, 285);

        pdf.save(`ER_Evidence_${new Date().getTime()}.pdf`);
        status.innerText = "Report Saved to Downloads.";
    }
</script>

</body>
</html>
