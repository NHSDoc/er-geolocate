<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ER GeoLocate</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { 
            --nhs-blue: #005eb8; --nhs-grey: #f0f4f5; --nhs-text: #212b32; 
            --success-green: #007f3b; --warning-amber: #fff9e6; --error-red: #d5281b;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--nhs-grey); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; color: var(--nhs-text); }
        .container { width: 100%; max-width: 480px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid var(--nhs-blue); }
        
        .logo-header { text-align: center; margin-bottom: 12px; }
        .app-logo { width: 100px; height: auto; margin-bottom: 2px; }
        
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .input-group { flex: 1; }
        .input-group.initials { flex: 0.4; } /* Smaller initials box */
        
        .input-group label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 2px; color: var(--nhs-blue); }
        .input-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        
        .employer-row { margin-bottom: 10px; }
        .remember-box { font-size: 0.7rem; color: #666; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
        .btn-capture { background: var(--nhs-blue); color: white; }
        .btn-capture:disabled { background: #ccc; cursor: not-allowed; }
        .btn-download { background: var(--success-green); color: white; display: none; }

        .probity-box { background: var(--warning-amber); border: 2px solid #ffcc00; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 0.75rem; line-height: 1.2; color: #444; }
        .probity-box input { transform: scale(1.2); margin-right: 8px; vertical-align: middle; }

        #result-area { display: none; width: 100%; }
        #export-container { padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 6px; width: 100%; box-sizing: border-box; }
        
        .pdf-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--nhs-blue); padding-bottom: 5px; margin-bottom: 8px; }
        .pdf-header-text h1 { color: var(--nhs-blue); font-size: 1.1rem; margin: 0; }
        .pdf-header-text h2 { color: #666; font-size: 0.75rem; margin: 0; }

        .map-wrapper { width: 100%; border-radius: 4px; overflow: hidden; border: 1px solid #eee; margin-bottom: 8px; }
        #map-img { width: 100%; display: block; background: #f0f0f0; min-height: 140px; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; font-size: 0.65rem; line-height: 1.1; }
        .data-item { overflow-wrap: break-word; word-wrap: break-word; hyphens: auto; }
        .data-item b { color: var(--nhs-blue); display: block; font-size: 0.6rem; text-transform: uppercase; margin-bottom: 1px; }
        
        /* Full width for employer to allow wrapping */
        .full-width { grid-column: 1 / -1; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 2px; }

        .unverified-text { color: var(--error-red); font-weight: bold; }
        
        .qr-area { text-align: center; border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 4px; }
        #qrcode { display: inline-block; padding: 4px; border: 1px solid #eee; background: #fff; }
        
        #facility-section { font-size: 0.65rem; color: #555; margin-top: 4px; border-top: 1px solid #eee; padding-top: 4px; display: none; }
        .copyright { text-align: center; color: #999; font-size: 0.65rem; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-header">
        <img src="logo.png" alt="ER GeoLocate Logo" class="app-logo">
        <h1 style="color:var(--nhs-blue); font-size:1.4rem; margin:0;">ER GeoLocate</h1>
    </div>

    <div class="input-row">
        <div class="input-group initials">
            <label for="userInitials">Initials:</label>
            <input type="text" id="userInitials" placeholder="--" maxlength="2" style="text-transform: uppercase;">
        </div>
        <div class="input-group">
            <label for="wardDept">Speciality:</label>
            <input type="text" id="wardDept" placeholder="e.g. Cardiology" maxlength="30">
        </div>
    </div>

    <div class="input-group employer-row">
        <label for="leadEmployer">Lead NHS Employer:</label>
        <input list="nhsTrusts" id="leadEmployer" placeholder="Search Trust or Board...">
        <datalist id="nhsTrusts"></datalist>
        <label class="remember-box">
            <input type="checkbox" id="rememberEmp"> Remember my employer
        </label>
    </div>

    <button id="capBtn" class="btn btn-capture" onclick="captureData()" disabled>📍 Verify & Capture Location</button>
    
    <div class="probity-box">
        <label>
            <input type="checkbox" id="probityCheck" onchange="toggleButton()">
            <b>Probity:</b> I certify recording clinical hours outside my rostered schedule. Bound by GMC guidance, I confirm this data is accurate.
        </label>
    </div>

    <div id="status" style="text-align:center; font-size: 0.75rem; color: #666; margin-bottom: 8px;">Accept declaration to begin.</div>

    <div id="result-area">
        <div id="export-container">
            <div class="pdf-header">
                <div class="pdf-header-text">
                    <h1>ER GeoLocate</h1>
                    <h2>Evidence ID: <span id="pdf-initials"></span></h2>
                </div>
                <img src="logo.png" style="width:70px; height:auto;">
            </div>
            
            <div class="map-wrapper">
                <img id="map-img" crossorigin="anonymous" src="">
            </div>
            
            <div class="data-grid">
                <div class="data-item full-width"><b>Lead Employer</b><span id="employer-display"></span></div>
                
                <div class="data-item"><b>Clinician Initials</b><span id="display-initials"></span></div>
                <div class="data-item"><b>Speciality</b><span id="dept-display"></span></div>
                
                <div class="data-item"><b>UK Network Time</b><span id="ind-time"></span></div>
                <div class="data-item"><b>Device Time</b><span id="dev-time"></span></div>
                
                <div class="data-item"><b>GPS Coordinates</b><span id="coords-display"></span></div>
                <div class="data-item"><b>Reference</b><span id="session-display"></span></div>
            </div>

            <div id="facility-section">
                <b>Nearest Verified Facility:</b> <span id="facility-display"></span>
            </div>

            <div class="qr-area">
                <div id="qrcode"></div>
            </div>
        </div>
        <button id="dlBtn" class="btn btn-download" onclick="downloadPDF()">Download ER GeoLocate Evidence</button>
    </div>
</div>

<div class="copyright">© Digestiv</div>

<script>
    const API_KEY = 'AIzaSyAS4xNopFGKYRQwssv2cfkFO-fCiHinYT8';
    
    // Condensed list of major Trusts/Boards for searching
    const trusts = [
        "Aneurin Bevan University Health Board", "Barking, Havering and Redbridge University Hospitals NHS Trust", 
        "Barts Health NHS Trust", "Belfast Health and Social Care Trust", "Betsi Cadwaladr University Health Board",
        "Birmingham Women's and Children's NHS Foundation Trust", "Cambridge University Hospitals NHS Foundation Trust",
        "Cardiff and Vale University Health Board", "Chelsea and Westminster Hospital NHS Foundation Trust",
        "Cwm Taf Morgannwg University Health Board", "Frimley Health NHS Foundation Trust",
        "Great Ormond Street Hospital for Children NHS Foundation Trust", "Guy's and St Thomas' NHS Foundation Trust",
        "Hampshire Hospitals NHS Foundation Trust", "Hywel Dda University Health Board",
        "Imperial College Healthcare NHS Trust", "King's College Hospital NHS Foundation Trust",
        "Leeds Teaching Hospitals NHS Trust", "London North West University Healthcare NHS Trust",
        "Manchester University NHS Foundation Trust", "NHS Ayrshire and Arran", "NHS Borders",
        "NHS Dumfries and Galloway", "NHS Fife", "NHS Forth Valley", "NHS Grampian",
        "NHS Greater Glasgow and Clyde", "NHS Highland", "NHS Lanarkshire", "NHS Lothian",
        "NHS Tayside", "Northern Health and Social Care Trust", "Northumbria Healthcare NHS Foundation Trust",
        "Oxford University Hospitals NHS Foundation Trust", "Powys Teaching Health Board",
        "Royal Free London NHS Foundation Trust", "Sandwell and West Birmingham Hospitals NHS Trust",
        "Sheffield Teaching Hospitals NHS Foundation Trust", "South Eastern Health and Social Care Trust",
        "Southern Health and Social Care Trust", "St George's University Hospitals NHS Foundation Trust",
        "Swansea Bay University Health Board", "The Newcastle Upon Tyne Hospitals NHS Foundation Trust",
        "University College London Hospitals NHS Foundation Trust", "University Hospitals Birmingham NHS Foundation Trust",
        "University Hospitals Bristol and Weston NHS Foundation Trust", "University Hospitals of Derby and Burton NHS Foundation Trust",
        "University Hospitals of Leicester NHS Trust", "Western Health and Social Care Trust"
    ]; 
    // Note: In production, this array would contain the full 230+ list. 
    // Users can still TYPE their own if not listed.

    // Populate Datalist
    const datalist = document.getElementById('nhsTrusts');
    trusts.forEach(t => {
        let option = document.createElement('option');
        option.value = t;
        datalist.appendChild(option);
    });

    // Check Local Storage on Load
    window.onload = function() {
        const savedEmp = localStorage.getItem('er_employer');
        if (savedEmp) {
            document.getElementById('leadEmployer').value = savedEmp;
            document.getElementById('rememberEmp').checked = true;
        }
    };

    const specialties = ["Gastroenterology", "Cardiology", "Acute Medicine", "General Surgery", "Paediatrics", "Emergency Medicine", "Anaesthetics", "Trauma & Orthopaedics", "Renal Medicine", "Maternity", "Geratology", "Haematology"];

    function updatePlaceholders() {
        const initInput = document.getElementById('userInitials');
        const specInput = document.getElementById('wardDept');
        if (!initInput.value) {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            initInput.placeholder = letters.charAt(Math.floor(Math.random() * 26)) + letters.charAt(Math.floor(Math.random() * 26));
        }
        if (!specInput.value) {
            specInput.placeholder = specialties[Math.floor(Math.random() * specialties.length)];
        }
    }
    setInterval(updatePlaceholders, 3000);
    updatePlaceholders();

    function toggleButton() {
        document.getElementById('capBtn').disabled = !document.getElementById('probityCheck').checked;
    }

    // Helper to abbreviate long Trust names for the QR code
    function abbreviateName(str) {
        if (!str) return "NA";
        // Get first letters of words longer than 2 chars (skips 'and', 'of')
        // Or simple first letters of all words
        return str.match(/\b(\w)/g).join('').toUpperCase();
    }

    async function getStrictUKTime() {
        // Redundancy 1 & 2: APIs
        const apiEndpoints = [
            'https://worldtimeapi.org/api/timezone/Europe/London',
            'https://timeapi.io/api/Time/current/zone?timeZone=Europe/London'
        ];
        for (let url of apiEndpoints) {
            try {
                const res = await fetch(url, { signal: AbortSignal.timeout(3500) });
                const data = await res.json();
                if (data.datetime || data.dateTime) return { time: new Date(data.datetime || data.dateTime).toLocaleString('en-GB', {timeZone: 'Europe/London'}), verified: true };
            } catch (e) {}
        }
        // Redundancy 3: TimeZoneDB
        try {
            const res = await fetch('https://api.timezonedb.com/v2.1/get-time-zone?key=L2M0Z8R7X9G1&format=json&by=zone&zone=Europe/London', { signal: AbortSignal.timeout(3500) });
            const data = await res.json();
            if (data.formatted) return { time: new Date(data.formatted).toLocaleString('en-GB', {timeZone: 'Europe/London'}), verified: true };
        } catch(e) {}
        // Redundancy 4: Web Header
        try {
            const res = await fetch('https://www.google.com', { method: 'HEAD', mode: 'no-cors' });
            const serverDate = res.headers.get('date');
            if (serverDate) return { time: new Date(serverDate).toLocaleString('en-GB', {timeZone: 'Europe/London'}), verified: true };
        } catch (e) {}
        
        // Fallback
        return { time: new Date().toLocaleString('en-GB', {timeZone: 'Europe/London'}), verified: false };
    }

    async function captureData() {
        const status = document.getElementById('status');
        const capBtn = document.getElementById('capBtn');
        const initials = document.getElementById('userInitials').value.toUpperCase() || "N/A";
        const deptName = document.getElementById('wardDept').value || "Not Specified";
        const employer = document.getElementById('leadEmployer').value || "Not Specified";
        
        // Handle Persistence
        if (document.getElementById('rememberEmp').checked) {
            localStorage.setItem('er_employer', employer);
        } else {
            localStorage.removeItem('er_employer');
        }
        
        capBtn.disabled = true;
        status.innerText = "Syncing verification data...";

        const timeObj = await getStrictUKTime();
        
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude: lat, longitude: lon } = pos.coords;
            const sid = 'ER-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            const empCode = abbreviateName(employer); // Short code for QR
            
            const timeEl = document.getElementById('ind-time');
            if (timeObj.verified) {
                timeEl.innerText = timeObj.time;
            } else {
                timeEl.innerHTML = `${timeObj.time} <span class="unverified-text">(Unverified, device based)</span>`;
            }

            // Facility 200m logic
            const facility = await getNearestFacility(lat, lon);
            const facSection = document.getElementById('facility-section');
            if (facility && facility.dist <= 0.2) {
                document.getElementById('facility-display').innerText = `${facility.name} (${(facility.dist * 1000).toFixed(0)}m)`;
                facSection.style.display = "block";
            } else {
                facSection.style.display = "none";
            }

            document.getElementById('display-initials').innerText = initials;
            document.getElementById('pdf-initials').innerText = initials;
            document.getElementById('employer-display').innerText = employer;
            document.getElementById('dept-display').innerText = deptName;
            document.getElementById('dev-time').innerText = new Date().toLocaleString('en-GB');
            document.getElementById('coords-display').innerText = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            document.getElementById('session-display').innerText = sid;
            
            document.getElementById('map-img').src = `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lon}&zoom=15&size=600x200&markers=color:blue%7Clabel:H%7C${lat},${lon}&key=${API_KEY}`;
            
            // Clean QR Generation (using empCode instead of full name to save space)
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = ""; 
            new QRCode(qrDiv, { 
                text: `REF:${sid}|EMP:${empCode}|USER:${initials}|TIME:${timeObj.time}|V:${timeObj.verified ? 'Y':'N'}`, 
                width: 130, height: 130, correctLevel: QRCode.CorrectLevel.L // Lower correction level for less density
            });

            document.getElementById('result-area').style.display = 'block';
            document.getElementById('dlBtn').style.display = 'flex';
            status.innerText = "Evidence Secured.";
            capBtn.disabled = false;
        }, (err) => { 
            status.innerText = "GPS Error."; 
            capBtn.disabled = false; 
        });
    }

    async function getNearestFacility(lat, lon) {
        try {
            const res = await fetch(`https://maps.googleapis.com/maps/api/place/nearbysearch/json?location=${lat},${lon}&rankby=distance&type=hospital|health|doctor&key=${API_KEY}`);
            const data = await res.json();
            if (data.status === "OK" && data.results.length > 0) {
                const f = data.results[0];
                const d = calculateDistance(lat, lon, f.geometry.location.lat, f.geometry.location.lng);
                return { name: f.name, dist: d };
            }
            return null;
        } catch(e) { return null; }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function downloadPDF() {
        const status = document.getElementById('status');
        const dlBtn = document.getElementById('dlBtn');
        status.innerText = "Building PDF...";
        dlBtn.disabled = true;

        html2canvas(document.getElementById('export-container'), { 
            useCORS: true, scale: 2.2 
        }).then(canvas => {
            const pdf = new jspdf.jsPDF('p', 'mm', 'a5');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 8, 128, 0);
            pdf.save(`ER_Evidence_${Date.now()}.pdf`);
            status.innerText = "Downloaded.";
            dlBtn.disabled = false;
        });
    }
</script>
</body>
</html>
