<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ER GeoLocate</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --nhs-blue: #005eb8;
            --nhs-grey: #f0f4f5;
            --nhs-text: #212b32;
            --success-green: #007f3b;
            --warning-amber: #fff9e6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: var(--nhs-grey);
            margin: 0; padding: 12px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            width: 100%; max-width: 480px;
            background: white; padding: 18px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 6px solid var(--nhs-blue);
        }

        /* Logo Styling */
        .app-logo {
            width: 180px;
            display: block;
            margin: 0 auto 15px auto;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: var(--nhs-blue); }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 8px;
            font-weight: bold; font-size: 1rem; cursor: pointer;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: center;
        }

        .btn-capture { background: var(--nhs-blue); color: white; }
        .btn-capture:disabled { background: #ccc; opacity: 0.6; }
        .btn-download { background: var(--success-green); color: white; margin-top: 10px; }

        .probity-box {
            background: var(--warning-amber); border: 2px solid #ffcc00;
            padding: 14px; border-radius: 8px; margin-bottom: 18px;
            font-size: 0.85rem; line-height: 1.4; color: #444;
        }

        .probity-box input { transform: scale(1.5); margin-right: 12px; vertical-align: middle; }

        #result-area { display: none; width: 100%; }

        #export-container { 
            margin-top: 15px; border: 1px solid #ddd; border-radius: 8px; 
            padding: 15px; background: #fff; position: relative;
        }
        
        .map-wrapper { width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid #eee; margin-bottom: 15px; }
        #map-img { width: 100%; display: block; min-height: 250px; background: #f0f0f0; }

        .qr-wrapper { display: flex; justify-content: center; padding: 15px 0; border-top: 1px dashed #ccc; }
        #qrcode { background: white; padding: 10px; border: 1px solid #eee; }

        .info-box { margin-top: 10px; font-size: 0.82rem; line-height: 1.5; border-top: 1px solid #eee; padding-top: 10px; }
        .info-box b { color: var(--nhs-blue); }

        .copyright { text-align: center; color: #999; font-size: 0.75rem; margin: 20px 0; width: 100%; }

        .admin-links a {
            display: block; color: var(--nhs-blue); text-decoration: none;
            padding: 10px; background: #f0f7ff; margin-bottom: 8px; border-radius: 6px; font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="ER GeoLocate Logo" class="app-logo">

    <div class="input-group">
        <label for="wardDept">Department / Ward Name:</label>
        <input type="text" id="wardDept" placeholder="e.g., Acute Medical Unit">
    </div>

    <button id="capBtn" class="btn btn-capture" onclick="captureData()" disabled>📍 Verify & Capture Location</button>
    
    <div class="probity-box">
        <label>
            <input type="checkbox" id="probityCheck" onchange="toggleButton()">
            <b>Probity:</b> I certify recording clinical hours outside my rostered schedule. Bound by GMC guidance, I confirm this data is accurate; falsifying location or device time/date is considered fraud.
        </label>
    </div>

    <div id="status" style="text-align:center; font-size: 0.8rem; color: #666; margin-bottom: 10px;">Accept declaration to begin.</div>

    <div id="result-area">
        <div id="export-container">
            <img src="logo.png" alt="ER GeoLocate" style="width: 120px; margin-bottom: 10px;">
            
            <div class="map-wrapper">
                <img id="map-img" crossorigin="anonymous" src="" alt="Map Loading...">
            </div>
            
            <div class="qr-wrapper">
                <div id="qrcode"></div>
            </div>

            <div class="info-box">
                <b>Department:</b> <span id="dept-display">---</span><br>
                <b>Verified Independent Time:</b> <span id="ind-time">Syncing...</span><br>
                <b>Device Recorded Time:</b> <span id="dev-time">---</span><br>
                <b>Nearest Address:</b> <span id="address-display">---</span><br>
                <b>GPS Coordinates:</b> <span id="coords-display">---</span><br>
                <b>Report Reference:</b> <span id="session-display">---</span>
            </div>
        </div>
        <button class="btn btn-download" onclick="downloadPDF()">📄 Download PDF Evidence</button>
    </div>

    <div class="admin-links">
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <a href="https://www.bma.org.uk/pay-and-contracts/working-hours/work-schedule/exception-reporting-for-resident-doctors" target="_blank">BMA Exception Reporting Guide</a>
        <a href="https://www.nhsemployers.org/articles/exception-reporting-reform-update" target="_blank">NHS Employers: Reform Update</a>
    </div>
</div>

<div class="copyright">©️ Digestiv</div>

<script>
    const API_KEY = 'AIzaSyAS4xNopFGKYRQwssv2cfkFO-fCiHinYT8';

    function toggleButton() {
        document.getElementById('capBtn').disabled = !document.getElementById('probityCheck').checked;
    }

    async function captureData() {
        const status = document.getElementById('status');
        const deptName = document.getElementById('wardDept').value || "Not Specified";
        status.innerText = "Authenticating location and time...";
        
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude: lat, longitude: lon } = pos.coords;
            
            let independentTime = await fetchVerifiedTime();
            const deviceTime = new Date().toLocaleString('en-GB');
            const address = await getAddress(lat, lon);
            const sid = 'ER-' + Math.random().toString(36).substr(2, 6).toUpperCase();

            document.getElementById('dept-display').innerText = deptName;
            document.getElementById('ind-time').innerText = independentTime;
            document.getElementById('dev-time').innerText = deviceTime;
            document.getElementById('address-display').innerText = address;
            document.getElementById('coords-display').innerText = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            document.getElementById('session-display').innerText = sid;
            
            document.getElementById('map-img').src = `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lon}&zoom=16&size=600x400&markers=color:blue%7Clabel:H%7C${lat},${lon}&key=${API_KEY}`;

            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = ""; 
            new QRCode(qrDiv, {
                text: `REF:${sid}|DEPT:${deptName}|TIME:${independentTime}|ADDR:${address}`,
                width: 160, height: 160
            });

            document.getElementById('result-area').style.display = 'block';
            status.innerText = "Location Authenticated.";
            window.scrollTo(0, document.body.scrollHeight);
        }, (err) => {
            status.innerText = "Error: GPS access denied.";
        });
    }

    async function fetchVerifiedTime() {
        try {
            const res = await fetch('https://worldtimeapi.org/api/timezone/Europe/London');
            const data = await res.json();
            return new Date(data.datetime).toLocaleString('en-GB');
        } catch(e) {
            try {
                const res2 = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=Europe/London');
                const data2 = await res2.json();
                return new Date(data2.dateTime).toLocaleString('en-GB');
            } catch(e2) {
                return new Date().toLocaleString('en-GB') + " (Manual Check Required)";
            }
        }
    }

    async function getAddress(lat, lon) {
        try {
            const res = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lon}&key=${API_KEY}`);
            const data = await res.json();
            return data.results[0] ? data.results[0].formatted_address : "Address not found";
        } catch(e) { return "Address Lookup Failed"; }
    }

    async function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const status = document.getElementById('status');
        status.innerText = "Compiling PDF...";

        const element = document.getElementById('export-container');
        
        // useCORS: true allows html2canvas to include the logo.png and Google Map
        html2canvas(element, { useCORS: true, scale: 2, logging: false }).then(canvas => {
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/png');
            pdf.addImage(imgData, 'PNG', 15, 20, 180, 0);
            
            pdf.setFontSize(8);
            pdf.setTextColor(180);
            pdf.text("©️ Digestiv", 105, 290, { align: 'center' });

            pdf.save(`ER_Evidence_${new Date().getTime()}.pdf`);
            status.innerText = "Report Downloaded.";
        });
    }
</script>

</body>
</html>
